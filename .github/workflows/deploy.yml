name: Deploy ingest

# Sync ingest code + Job definition (no schedule in Git — set in Jobs UI).
#   push/merge to dev  → -t dev  → crm_dev
#   merge to main      → -t prod → crm  (PR + approval only)
# Does not run ingest. Manual: workflow_dispatch with run_ingest=true.

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      run_ingest:
        description: "Also run ingest_bronze once after deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "bundle_target=dev" >> "$GITHUB_OUTPUT"
            echo "catalog=crm_dev" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_target=prod" >> "$GITHUB_OUTPUT"
            echo "catalog=crm" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: |
          pytest tests/test_validators.py \
            tests/test_config_env.py \
            tests/test_apply_uc_ddl_rewrite.py -q

      - name: Bundle deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Missing DATABRICKS_HOST/TOKEN secrets"
            exit 1
          fi
          EXTRA_VARS=""
          if [ -n "${{ secrets.JOB_FAILURE_EMAIL }}" ]; then
            EXTRA_VARS="--var=job_failure_email=${{ secrets.JOB_FAILURE_EMAIL }}"
          fi
          databricks bundle deploy -t "${{ steps.target.outputs.bundle_target }}" $EXTRA_VARS

      - name: Apply UC DDL (bronze tables)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          DATABRICKS_CATALOG: ${{ steps.target.outputs.catalog }}
          DATABRICKS_BRONZE_SCHEMA: bronze
        run: |
          if [ -z "$DATABRICKS_HTTP_PATH" ]; then
            echo "Missing DATABRICKS_HTTP_PATH secret"
            exit 1
          fi
          mkdir -p configs
          cat > configs/.env <<EOF
          HUBSPOT_TOKEN=${HUBSPOT_TOKEN:-unused-for-ddl}
          DATABRICKS_HOST=${DATABRICKS_HOST}
          DATABRICKS_HTTP_PATH=${DATABRICKS_HTTP_PATH}
          DATABRICKS_TOKEN=${DATABRICKS_TOKEN}
          DATABRICKS_CATALOG=${DATABRICKS_CATALOG}
          DATABRICKS_BRONZE_SCHEMA=${DATABRICKS_BRONZE_SCHEMA}
          EOF
          python scripts/apply_uc_ddl.py --catalog "$DATABRICKS_CATALOG" --bronze-schema bronze

      - name: Optional one-off ingest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ingest }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run ingest_bronze -t "${{ steps.target.outputs.bundle_target }}"
