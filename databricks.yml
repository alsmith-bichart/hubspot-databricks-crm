# Minimal Asset Bundle: sync ingest code + Job definition (no schedule in Git).
# Schedule: Databricks Jobs UI. Docs: docs/operating_model.md
#
# Targets (same workspace, separate catalogs):
#   dev  → crm_dev  (branch: dev)
#   prod → crm      (branch: main, PR + approval)

bundle:
  name: hubspot_databricks_crm

variables:
  catalog:
    description: Unity Catalog name
    default: crm
  bronze_schema:
    description: Bronze schema name
    default: bronze
  job_failure_email:
    description: Email for ingest_bronze Job failure alerts
    default: data-eng@example.com

include:
  - resources/*.yml
  - resources/**/*.yml

sync:
  include:
    - uc/**
    - scripts/**
    - ingestion/**
    - schemas/**
  exclude:
    - configs/**
    - "**/.env"
    - "**/__pycache__/**"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a253fa01-3849.cloud.databricks.com
      root_path: ~/bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: crm_dev
      bronze_schema: bronze

  prod:
    mode: production
    workspace:
      host: https://dbc-a253fa01-3849.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: crm
      bronze_schema: bronze
