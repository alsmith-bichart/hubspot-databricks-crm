# Databricks Asset Bundle — UC schema/tables + Jobs (Git/PR only).
# Docs: docs/cicd_governance.md
#
# Targets (same workspace, separate catalogs):
#   dev  → crm_dev.bronze  (branch: dev, GitHub env: development)
#   prod → crm.bronze     (branch: main, GitHub env: production)

bundle:
  name: hubspot_databricks_crm

variables:
  catalog:
    description: Unity Catalog name
    default: crm
  bronze_schema:
    description: Bronze schema name
    default: bronze
  warehouse_id:
    description: SQL warehouse ID (optional; used by docs / local CLI)
    default: ""
  job_failure_email:
    description: Email for ingest_bronze Job failure alerts
    default: data-eng@example.com

include:
  - resources/*.yml
  - resources/**/*.yml

sync:
  include:
    - uc/**
    - scripts/**
    - ingestion/**
    - schemas/**
  exclude:
    - configs/**
    - "**/.env"
    - "**/__pycache__/**"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a253fa01-3849.cloud.databricks.com
      root_path: ~/bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: crm_dev
      bronze_schema: bronze
    resources:
      jobs:
        ingest_bronze:
          schedule:
            pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-a253fa01-3849.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/bundles/${bundle.name}/${bundle.target}
    variables:
      catalog: crm
      bronze_schema: bronze
