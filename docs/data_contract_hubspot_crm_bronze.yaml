# Data product contract — HubSpot CRM Bronze
# Audience: consumers discovering/using crm.bronze.* in Databricks
# Source of truth for column shapes in code: schemas/object_specs.py
# This YAML is the consumer-facing product contract (ownership, policies, SLAs).

version: "1.0.0"
status: active
last_updated: "2026-08-05"

data_product:
  name: hubspot_crm_bronze
  display_name: HubSpot CRM Bronze
  layer: bronze
  domain: crm
  catalog: crm
  schema: bronze
  description: >
    Append-only HubSpot CRM snapshots landed in Unity Catalog for analytics
    engineering. Each pipeline run writes a full extract keyed by
    (_ingestion_run_id). Prefer this product for raw lineage and replay;
    use a future silver product for current-state typed entities.
  purpose: >
    Preserve HubSpot source fidelity (raw_json + requested properties) so
    downstream silver/gold can rebuild without re-hitting HubSpot.
  tags:
    - hubspot
    - crm
    - bronze
    - medallion
  discovery:
    primary_tables:
      - crm.bronze.contacts
      - crm.bronze.companies
      - crm.bronze.deals
      - crm.bronze.owners
      - crm.bronze.deal_pipeline_stages
      - crm.bronze.contact_company_associations
      - crm.bronze.deal_company_associations
      - crm.bronze.deal_contact_associations
    how_to_use: >
      For contacts/companies/deals use WHERE _is_current = true for current
      state, or query version history via _valid_from/_valid_to. Owners/stages/
      associations remain append snapshots keyed by _ingestion_run_id.
    example_sql: |
      SELECT *
      FROM crm.bronze.contacts
      WHERE _is_current = true
      LIMIT 100;

ownership_and_security:
  product_owner:
    name: Alec Smith
    email: alec.smith@bichart.ai
    role: Data Product Owner
  technical_owner:
    name: Analytics Engineering
    email: data-eng@bichart.ai
    role: Pipeline maintainers
  steward:
    name: CRM Ops
    email: crm-ops@bichart.ai
  access_approver:
    name: Data Governance
    email: data-governance@bichart.ai
  security:
    classification: internal
    contains_pii: true
    pii_fields_examples:
      - contacts.properties_json (email, names)
      - owners.email
      - raw_json payloads may include PII
    row_level_security: none_enforced_at_bronze
    column_level_security: none_enforced_at_bronze
    notes: >
      UC grants control who can SELECT. Bronze intentionally keeps full raw
      payloads; restrict schema grants to approved consumers. Masking belongs
      in silver/gold for wider audiences.
  allowed_principals:
    - group: data-engineers
      access: read_write
    - group: analytics-engineers
      access: read
    - group: crm-analysts
      access: read
    - group: everyone
      access: none

usage_policies:
  allowed_uses:
    - Downstream silver/gold transformations
    - Ad-hoc exploration by approved analysts
    - Pipeline debugging and data quality investigations
    - Historical replay / backfill of derived models
  disallowed_uses:
    - Direct customer-facing APIs or exports without redaction
    - Training public/external ML models on raw PII
    - Joining and redistributing outside approved workspaces
    - Treating a single row as guaranteed current HubSpot state
  access_method: >
    Databricks SQL / notebooks against Unity Catalog. Ingest only via
    scripts/ingest_bronze.py (or scheduled Job wrapping it).
  citation: >
    When publishing metrics, cite source system = hubspot and the
    _ingestion_run_id used.
  change_management: >
    Breaking schema changes require contract version bump and steward notice
    before deploy. Additive columns are minor revisions.

schema:
  grain: >
    CRM objects: SCD2 version grain (hubspot_id, _valid_from); current =
    _is_current. Owners/stages/associations: append grain =
    business_key(s) + _ingestion_run_id.
  load_pattern: scd2_crm_objects_append_others
  source_system: hubspot
  technical_columns:
    - name: _ingested_at
      type: TIMESTAMP
      description: UTC load timestamp for the pipeline run
    - name: _ingestion_run_id
      type: STRING
      description: UUID identifying the pipeline run snapshot
    - name: _source_system
      type: STRING
      description: Always 'hubspot' for this product
      allowed_values: ["hubspot"]

  tables:
    - name: contacts
      fqn: crm.bronze.contacts
      description: HubSpot contact objects (SCD Type 2)
      load_pattern: scd2
      business_keys: [hubspot_id]
      version_keys: [hubspot_id, _valid_from]
      hubspot_properties_requested: [email, firstname, lastname]
      columns:
        - {name: hubspot_id, type: STRING, description: HubSpot record id}
        - {name: object_type, type: STRING, description: Always 'contacts'}
        - {name: properties_json, type: STRING, description: JSON of requested properties}
        - {name: raw_json, type: STRING, description: Full HubSpot API object JSON}
        - {name: hubspot_created_at, type: STRING, description: Source createdAt as received}
        - {name: hubspot_updated_at, type: STRING, description: Source updatedAt as received}
        - {name: archived, type: BOOLEAN, description: HubSpot archived flag}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}
        - {name: _valid_from, type: TIMESTAMP}
        - {name: _valid_to, type: TIMESTAMP}
        - {name: _is_current, type: BOOLEAN}

    - name: companies
      fqn: crm.bronze.companies
      description: HubSpot company objects (SCD Type 2)
      load_pattern: scd2
      business_keys: [hubspot_id]
      version_keys: [hubspot_id, _valid_from]
      hubspot_properties_requested: [name, domain]
      columns:
        - {name: hubspot_id, type: STRING}
        - {name: object_type, type: STRING}
        - {name: properties_json, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: hubspot_created_at, type: STRING}
        - {name: hubspot_updated_at, type: STRING}
        - {name: archived, type: BOOLEAN}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}
        - {name: _valid_from, type: TIMESTAMP}
        - {name: _valid_to, type: TIMESTAMP}
        - {name: _is_current, type: BOOLEAN}

    - name: deals
      fqn: crm.bronze.deals
      description: HubSpot deal objects (SCD Type 2)
      load_pattern: scd2
      business_keys: [hubspot_id]
      version_keys: [hubspot_id, _valid_from]
      hubspot_properties_requested:
        [dealname, amount, dealstage, closedate, pipeline, hubspot_owner_id]
      columns:
        - {name: hubspot_id, type: STRING}
        - {name: object_type, type: STRING}
        - {name: properties_json, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: hubspot_created_at, type: STRING}
        - {name: hubspot_updated_at, type: STRING}
        - {name: archived, type: BOOLEAN}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}
        - {name: _valid_from, type: TIMESTAMP}
        - {name: _valid_to, type: TIMESTAMP}
        - {name: _is_current, type: BOOLEAN}

    - name: owners
      fqn: crm.bronze.owners
      description: HubSpot owners (users who own CRM records)
      business_keys: [owner_id]
      history_keys: [owner_id, _ingestion_run_id]
      columns:
        - {name: owner_id, type: STRING}
        - {name: user_id, type: STRING}
        - {name: email, type: STRING, pii: true}
        - {name: first_name, type: STRING, pii: true}
        - {name: last_name, type: STRING, pii: true}
        - {name: teams_json, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: hubspot_created_at, type: STRING}
        - {name: hubspot_updated_at, type: STRING}
        - {name: archived, type: BOOLEAN}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}

    - name: deal_pipeline_stages
      fqn: crm.bronze.deal_pipeline_stages
      description: HubSpot deal pipeline stages (one row per stage per run)
      business_keys: [pipeline_stage_key]
      history_keys: [pipeline_stage_key, _ingestion_run_id]
      columns:
        - {name: pipeline_stage_key, type: STRING, description: "pipeline_id|stage_id"}
        - {name: pipeline_id, type: STRING}
        - {name: pipeline_label, type: STRING}
        - {name: stage_id, type: STRING}
        - {name: stage_label, type: STRING}
        - {name: display_order, type: INT}
        - {name: metadata_json, type: STRING}
        - {name: pipeline_created_at, type: STRING}
        - {name: pipeline_updated_at, type: STRING}
        - {name: pipeline_archived, type: BOOLEAN}
        - {name: stage_created_at, type: STRING}
        - {name: stage_updated_at, type: STRING}
        - {name: stage_archived, type: BOOLEAN}
        - {name: raw_json, type: STRING}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}

    - name: contact_company_associations
      fqn: crm.bronze.contact_company_associations
      description: Contact–company association edges from HubSpot v4 batch read
      business_keys:
        [contact_id, company_id, association_category, association_type_id]
      history_keys:
        [contact_id, company_id, association_category, association_type_id, _ingestion_run_id]
      required_ids: [contact_id, company_id]
      columns:
        - {name: contact_id, type: STRING}
        - {name: company_id, type: STRING}
        - {name: association_category, type: STRING}
        - {name: association_type_id, type: BIGINT}
        - {name: association_label, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}

    - name: deal_company_associations
      fqn: crm.bronze.deal_company_associations
      description: Deal–company association edges
      business_keys:
        [deal_id, company_id, association_category, association_type_id]
      history_keys:
        [deal_id, company_id, association_category, association_type_id, _ingestion_run_id]
      required_ids: [deal_id, company_id]
      columns:
        - {name: deal_id, type: STRING}
        - {name: company_id, type: STRING}
        - {name: association_category, type: STRING}
        - {name: association_type_id, type: BIGINT}
        - {name: association_label, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}

    - name: deal_contact_associations
      fqn: crm.bronze.deal_contact_associations
      description: Deal–contact association edges
      business_keys:
        [deal_id, contact_id, association_category, association_type_id]
      history_keys:
        [deal_id, contact_id, association_category, association_type_id, _ingestion_run_id]
      required_ids: [deal_id, contact_id]
      columns:
        - {name: deal_id, type: STRING}
        - {name: contact_id, type: STRING}
        - {name: association_category, type: STRING}
        - {name: association_type_id, type: BIGINT}
        - {name: association_label, type: STRING}
        - {name: raw_json, type: STRING}
        - {name: _ingested_at, type: TIMESTAMP}
        - {name: _ingestion_run_id, type: STRING}
        - {name: _source_system, type: STRING}

data_quality_metrics:
  enforced_in_pipeline:
    - id: dq_required_ids
      name: Required HubSpot IDs present
      type: completeness
      check: >
        Business / endpoint IDs non-null and non-empty before append
        (ingestion.validators.validate_rows)
      severity: error
    - id: dq_raw_json
      name: Raw JSON retained
      type: completeness
      check: raw_json present on every bronze row (pre-load + post-load SQL)
      severity: error
    - id: dq_tech_fields
      name: Technical ingestion fields present
      type: completeness
      check: "_ingested_at, _ingestion_run_id, _source_system='hubspot'"
      severity: error
    - id: dq_scd2_current_unique
      name: One current SCD2 row per hubspot_id
      type: uniqueness
      check: assert_one_current_per_business_key on contacts/companies/deals
      severity: error
    - id: dq_history_unique
      name: Append history keys unique
      type: uniqueness
      check: >
        For owners/stages/associations, DISTINCT history_keys equals row count
      severity: error
    - id: dq_batch_unique
      name: Batch business keys unique within run
      type: uniqueness
      check: No duplicate business keys inside a single mapped batch
      severity: error
  integration_checks:
    - id: dq_sampled_ingest
      name: Sampled one-ingest quality
      type: end_to_end
      check: >
        tests/test_bronze_quality.py runs one sampled ingest (default 25);
        SCD2 current checks for CRM objects; run-scoped checks for append tables
      severity: error
  targets:
    completeness_required_fields: 100
    uniqueness_scd2_current: 100
    uniqueness_history_keys: 100
    schema_match_object_specs: 100
  monitoring:
    dashboards: TBD
    alerting: manual / pipeline hard-fail on validation errors

service_level_agreements:
  freshness:
    target: "<= 24 hours after HubSpot change for scheduled runs"
    current_mode: on_demand_manual
    measure: max(_ingested_at) vs wall clock
  availability:
    target: "95% successful scheduled ingest runs / month"
    dependency: Databricks SQL warehouse + HubSpot API uptime
  validity:
    schema_compatibility: >
      Live UC tables must include all columns in schemas/object_specs.py
      for the declared tables
    timezone: "UTC for _ingested_at"
  retention:
    bronze_history: "90 days of ingestion runs (policy placeholder)"
    raw_json: same_as_table_retention
    purge_method: "TBD (DELETE by _ingested_at or table OPTIMIZE + vacuum policy)"
  performance:
    ingest_window_hint: "< 30 minutes for current HubSpot volume (learning env)"
  support:
    response_time: "2 business days for access or schema questions"
    channel: "slack-data-crm-placeholder"

links:
  code_contract: schemas/object_specs.py
  uc_ddl: uc/ddl/
  cicd_governance: docs/cicd_governance.md
  architecture: docs/architecture.md
  table_docs: docs/bronze_tables.md
  apply_ddl: scripts/apply_uc_ddl.py
  ingest_entry: scripts/ingest_bronze.py
  quality_script: tests/test_bronze_quality.py
